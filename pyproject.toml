[project]
name = "fast-deconv"
version = "0.4.1"
description = "GPU-accelerated deconvolution for radio astronomy"
readme = "README.md"
authors = [
  { name = "Hugo Gaquere", email = "hugo.gaquere@obspm.fr" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies=["numpy", "cupy-cuda12x"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11", "numpy", "conan"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
editable.rebuild = true

[tool.scikit-build.cmake]
define = {CMAKE_PROJECT_TOP_LEVEL_INCLUDES = "cmake/conan_provider.cmake"}

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }]

# Tests are C++/GTest only (they need a GPU): no wheel test-command.
[tool.cibuildwheel]
build-frontend = "build[uv]"

