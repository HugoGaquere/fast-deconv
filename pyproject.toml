[project]
name = "fast-deconv"
version = "0.9.1"
description = "High-performance deconvolution for radio astronomy, on GPUs and multi-core CPUs"
readme = "README.md"
authors = [
  { name = "Hugo Gaquere", email = "hugo.gaquere@obspm.fr" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies=["numpy"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0", "numpy", "conan"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}-host"
editable.rebuild = true

[tool.scikit-build.cmake.define]
CMAKE_PROJECT_TOP_LEVEL_INCLUDES = "cmake/conan_provider.cmake"
FAST_DECONV_BACKEND = {env = "FAST_DECONV_BACKEND", default = "host"}

# The backends enable different CMake languages, so they cannot share a cache.
[[tool.scikit-build.overrides]]
if.env.FAST_DECONV_BACKEND = "cuda"
build-dir = "build/{wheel_tag}-cuda"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }, { env = "FAST_DECONV_BACKEND" }]

# Tests are C++/GTest; CUDA tests need a GPU. No wheel test-command.
[tool.cibuildwheel]
build-frontend = "build[uv]"

[dependency-groups]
dev = ["pybind11-stubgen"]

